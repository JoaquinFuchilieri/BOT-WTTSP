<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F-Dispatch — Gestor de Cuentas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="container">
        <header>
            <div style="display: flex; align-items: center; gap: 14px;">
                <img src="assets/logo.png" alt="F-Dispatch Logo" class="app-logo app-logo-md">
                <div>
                    <h1 id="page-title">F-Dispatch — Gestor de Cuentas</h1>
                    <p id="user-info-display" class="text-secondary" style="font-size: 13px; margin-top: 4px;"></p>
                </div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btn-help" class="btn-secondary" style="padding: 8px 14px;"><i data-lucide="book-open"></i> Ayuda</button>
                <button id="add-profile-btn" class="btn-accent"><i data-lucide="plus"></i> Agregar nueva cuenta</button>
                <button id="logout-btn" class="btn-secondary" style="padding: 8px 14px;"><i data-lucide="log-out"></i> Cerrar sesión</button>
            </div>
        </header>

        <!-- SYSTEM ANNOUNCEMENT BANNER -->
        <div id="announcement-banner-container" class="announcement-banner hidden"></div>

        <!-- BREADCRUMB / OPERATOR FILTER BAR (Shown for Admin role) -->
        <div id="admin-nav-bar" class="admin-nav-bar hidden">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Ver WhatsApps de:</span>
                <select id="operator-select" class="apple-select">
                    <option value="all">Todos los Operadores</option>
                    <!-- Populated dynamically -->
                </select>
            </div>
            <div id="operator-badge-info" style="font-size: 12.5px; color: var(--text-secondary);">
                <!-- Dynamic details -->
            </div>
        </div>

        <main>
            <!-- MULTI-BOT FLEET TOOLBAR -->
            <div id="fleet-toolbar" class="fleet-toolbar">
                <div class="fleet-info">
                    <span id="fleet-status-label" class="fleet-badge"><i data-lucide="bot"></i> Flota de Bots: 0 activos</span>
                    <span id="fleet-queue-summary" style="font-size: 12.5px; color: var(--text-secondary); margin-left: 10px;"></span>
                </div>
                <div class="fleet-actions">
                    <button id="btn-start-all-bots" class="btn-primary" style="padding: 8px 18px; font-size: 13px;"><i data-lucide="play"></i> Iniciar Flota</button>
                    <button id="btn-stop-all-bots" class="btn-danger" style="padding: 8px 18px; font-size: 13px;"><i data-lucide="square"></i> Detener Todos</button>
                </div>
            </div>

            <div id="profiles-grid" class="profiles-grid">
                <!-- Profile cards will be rendered here -->
            </div>
        </main>
        <div class="fuchi-watermark" style="margin-top: 30px; margin-bottom: 12px;">powered by Fuchi</div>
    </div>

    <!-- Add Profile Modal (Direct child of body for clean overlay stacking) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2>Nuevo Perfil</h2>
            <div class="form-group">
                <label for="profile-name">Nombre del perfil:</label>
                <input type="text" id="profile-name" placeholder="Ej. Ventas" autocomplete="off">
            </div>
            <div class="form-group" id="profile-assign-group">
                <label for="profile-assigned-user">Asignar cuenta obligatoriamente a:</label>
                <select id="profile-assigned-user" class="apple-select">
                    <!-- Populated dynamically -->
                </select>
            </div>
            <p id="modal-error" class="text-danger mt-10 hidden"></p>
            <div class="modal-actions">
                <button id="cancel-add-btn" class="btn-secondary" type="button">Cancelar</button>
                <button id="confirm-add-btn" class="btn-primary" type="button">Guardar</button>
            </div>
        </div>
    </div>
    <!-- Modal: Manual de Ayuda -->
    <div id="modal-help" class="modal hidden">
        <div class="modal-content modal-large">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="book-open" style="color: var(--accent-pink); width: 22px; height: 22px;"></i>
                    <h2 id="help-modal-title" style="margin: 0; font-size: 17px;">Manual de Uso e Interacción — F-Dispatch</h2>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="text" id="help-modal-search" class="apple-input" placeholder="Buscar en el manual..." style="padding: 6px 12px; font-size: 12px; width: 180px;">
                    <button id="btn-close-help-modal" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">Cerrar</button>
                </div>
            </div>

            <!-- Quick jump bar (Desktop specific without web panel) -->
            <div id="help-modal-quick-bar" class="help-quick-bar">
                <button type="button" class="help-nav-pill active" data-target="all">Todo el Manual</button>
                <button type="button" class="help-nav-pill" data-target="1-programa-de-escritorio">1. Programa Desktop</button>
                <button type="button" class="help-nav-pill" data-target="2-opciones-y-retardos">2. Retardos & Seguridad</button>
                <button type="button" class="help-nav-pill" data-target="anti-ban">3. Consejos Anti-Ban</button>
            </div>

            <!-- Content display -->
            <div id="help-modal-display" class="manual-content-display" style="max-height: 60vh;">
                <div style="color: var(--text-secondary); text-align: center; padding: 20px;">Cargando manual...</div>
            </div>
            <div class="fuchi-watermark" style="padding: 8px 0 0 0; font-size: 10px;">powered by Fuchi</div>
        </div>
    </div>

    <!-- Lock Screen Modal for Kill Switch -->
    <div id="lock-screen" class="lock-screen hidden">
        <div class="lock-box">
            <div class="lock-icon"><i data-lucide="shield-alert" style="width: 48px; height: 48px; stroke: var(--accent-red);"></i></div>
            <h2 id="lock-title" class="text-danger">Cuenta Suspendida</h2>
            <p id="lock-message" class="mt-10 text-secondary">Tu empresa ha sido suspendida en el servidor central o no se cuenta con una licencia activa.</p>
            <button id="lock-logout-btn" class="btn-primary mt-10" style="margin-top: 20px;">Volver al inicio</button>
        </div>
    </div>
    <script src="js/lucide.min.js"></script>
    <script src="js/icons-helper.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/profiles.js"></script>
</body>
</html>
