<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión — F-Dispatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <img src="assets/logo.png" alt="F-Dispatch Logo" class="login-brand-logo" onerror="this.onerror=null; this.src='assets/logo.jpg';">
            <h2>Bienvenido</h2>
            <p class="subtitle">Ingresá con tu cuenta para activar F-Dispatch</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="text" id="email" placeholder="usuario@empresa.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <p id="error-msg" class="text-danger mt-10 hidden"></p>

                <button type="submit" id="submit-btn" class="btn-primary btn-login">Ingresar</button>
            </form>

            <div class="login-footer-prompt">
                <span class="prompt-text">¿Aún envías mensajes manualmente?</span>
                <a href="contacto.html" class="contact-link">Contáctanos</a>
            </div>

            <div class="fuchi-watermark" style="margin-top: 18px;">powered by Fuchi</div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
